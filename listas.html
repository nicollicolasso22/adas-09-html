<!DOCTYPE html>
<html>
    <head>
        <title>Listas</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Listas</h1>
        <h2>Lista não ordenada UL</h2>
        <!-- ul é unsorted list (lista não ordenada) -->
        <ul>
            <li>Pizza de calabresa</li>
            <li>Lasanha de frango</li>
            <li>Estrogonofe de carne</li>
            <li>Macarrão parafuso com molho de calabresa picante</li>
        </ul>
        <h2>Lista ordenada OL</h2>
        <ol>
            <li>Amarelo</li>
            <li>Verde</li>
            <li>Laranja</li>
            <li>Rosa</li>
        </ol>
    </body>
</html>
