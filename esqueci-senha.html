<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha</title>
</head>
<body>
    <form action="esqueci-senha.php" method="get">
        <label for="campo-email">E-mail</label>
        <input type="email" id="campo-email" name="email" required>
        <br/>
        <label for="campo-senha">Senha</label>
        <input type="password" id="campo-senha" name="senha" required>
        <br/>
        <label for="campo-confirmacao-senha">Confirmação da senha</label>
        <input type="password" id="campo-confirmacao-senha" name="senha" required>
        <br/>
        <button type="submit">Alterar</button>
    </form>
</body>
</html>
