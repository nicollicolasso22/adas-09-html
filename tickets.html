<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets</title>
</head>
<body style="text-align: center;">
    <h1>compra de tickets</h1>
    <h2>Dados Pessoais</h2>
    <form method="get" action="salvar-cliente.php">
        <div>
            <label for="campo-nome">Nome</label>
            <input type="text" id="campo-nome" name="nome" minlength="3" maxlength="20" required>
        </div>

        <div>
            <label for="campo-cpf">CPF</label>
            <input type="text" id="campo-cpf" name="cpf" pattern=[0-9] {11}maxlength="11" required>
        </div>
        <div>
            <label for="campo-contato-email">E-mail</label>
            <input type="text" id="campo-contato-email" name="contato"><br>
            <label for="campo-contato-telefone">Telefone</label>
            <input type="text" id="campo-contato-telefone" name="contato"><br>
            <label for="campo-data-nascimento">Data de Nascimento</label>
            <input type="text" id="campo-data-nascimento" name="data" minlength="16" maxlength="60" required>
        </div>
        <div>
            <h2>Formas de Pagamento</h2>
            <input type="radio" id="campo-pagamento-pix" name="pagamento" value="pix">
            <label for="campo-pagamento-pix">Pix</label><br>
            <input type="radio" id="campo-pagamento-cc" name="pagamento" value="cc">
            <label for="campo-pagamento-cc">Cartão de Crédito</label>
        </div>
        <div>    
            <input type="text" id="campo-numero-cartao" name="numero-cartao" pattern="[0-9] {16}">
            <label for="campo-numero-cartao">Número do Cartão</label><br>
            <input type="number" id="validade-mes" name="validade-mes" min="1" max="12" required>
            <label for="campo-validade-mes">Válidade (mês)</label><br>
            <input type="number" id="validade-ano" name="validade-ano" min="2026" max="2036 required required">
            <label for="campo-validade-ano">Válidade (ano)</label><br>
            <input type="text" id="cvc" name="cvc" minlength="3" maxlength="3" required>
            <label for="cvc">CVC:</label><br>
            <input type="text" id="nome-cartao" name="nome-cartao" minlenth="5" maxlength="50" required>
            <label for="nome-cartao">Nome no Cartão:</label><br>
        </div>
        <div>
            <button type="submit">Salvar</button>
        </div>

    </form>
</body>
</html>
